<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>거울 던전 팬메이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 상단 상태줄 / 전장(수감자 4칸 ← 대치 → 적 4칸) / 손패. 어두운 단일 테마(게임 화면) */
:root{
  --abyss:#0f0b0c; --panel:#181214; --raise:#221a1c; --line:#3a2d2e; --line-hi:#5c4744;
  --bone:#ece0c8; --bone-dim:#ab9c8a; --bone-faint:#76695e;
  --paper:#dfd1b4; --paper-2:#cdbd9c; --ink:#22180f; --ink-dim:#5a4a3a;
  --brass:#d8ab3e; --brass-dim:#8d6c25;
  --blood:#c33b2e; --blockc:#86a5c0; --sp-up:#5db8c6; --sp-down:#c04a78; --good:#7fb069;
  --sin-wrath:#d23a40; --sin-lust:#e47d30; --sin-sloth:#d8bc45; --sin-gluttony:#86ae3f;
  --sin-gloom:#40a8b9; --sin-pride:#4470d4; --sin-envy:#9554cc;
  --f-display:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'Menlo',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--abyss); color:var(--bone); font-family:var(--f-body); font-size:14px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -8%, #2b191b 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 110%, #1d1517 0%, transparent 70%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit}
#app{max-width:1280px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:900;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-faint);font-weight:700}
.muted{color:var(--bone-dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-hi);background:var(--raise);color:var(--bone);padding:9px 16px;font-weight:700;cursor:pointer;border-radius:2px;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn:focus-visible,.card:focus-visible,.unit:focus-visible,.node:focus-visible,.tile:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1b1206}
.btn.primary:hover:not(:disabled){background:#e6bb52}
.btn.danger{border-color:#7a2a24;color:#f0b4ac}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.topbar .where{font-family:var(--f-display);font-weight:900;font-size:17px;margin-right:auto}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--bone-dim)}
.stat b{color:var(--bone);font-family:var(--f-num)}
.gift{display:inline-flex;border:1px solid var(--brass-dim);color:var(--brass);font-size:11px;padding:2px 7px;cursor:help;background:transparent}
.consbtn{border:1px solid var(--line-hi);background:var(--raise);font-size:12px;padding:3px 8px;cursor:pointer}
.consbtn.on{border-color:var(--brass);color:var(--brass)}

/* combat layout */
.combat{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:1100px){.combat{grid-template-columns:minmax(0,1fr) 260px}.combat .cside{grid-row:1/span 2;grid-column:2;align-self:start}.cside .log{max-height:400px}}
.field{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);align-items:end;gap:8px;padding-top:96px}
.arrows{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:5}
.arrow-line{stroke-dashoffset:0}
.chip.stance{border-color:#e9b949;color:#f3d68a}
.side{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.vs{align-self:center;text-align:center;font-family:var(--f-display);color:var(--bone-faint);font-size:12px;writing-mode:vertical-rl;letter-spacing:.3em}
@media (max-width:760px){
  .field{grid-template-columns:minmax(0,1fr)}
  .vs{writing-mode:horizontal-tb;letter-spacing:.2em}
  .field .enemyside{order:-1}
  .field .partyside{order:1}
  .field{padding-top:8px;gap:18px}
}
.slot-empty{border:1px dashed var(--line);min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--bone-faint);font-size:11px}

/* unit plates */
.unit{position:relative;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--sin);padding:8px 8px 9px;display:flex;flex-direction:column;gap:5px;min-width:0;text-align:left;cursor:default}
.unit.clickable{cursor:pointer}
.unit.sel{outline:2px solid var(--brass);outline-offset:1px}
.unit.targetable{outline:2px dashed var(--brass);outline-offset:1px;cursor:pointer;background:#2a2116}
.unit.nottarget{opacity:.45}
.unit.panic{border-color:var(--sp-down)}
.u-top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--bone-faint);letter-spacing:.06em}
.u-top .pos{color:var(--brass);font-weight:700}
.u-name{font-family:var(--f-display);font-weight:900;font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.u-role{font-size:11px;color:var(--bone-dim)}
.bar{position:relative;height:15px;background:#0a0708;border:1px solid var(--line)}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .3s}
.bar>b{position:relative;display:block;text-align:center;font:600 10.5px/13px var(--f-num);color:#fff;text-shadow:0 1px 1px #000}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--brass);opacity:.85}
.spbar{position:relative;height:7px;background:#0a0708;border:1px solid var(--line)}
.spbar>i{position:absolute;top:0;bottom:0}
.spbar>i.pos{background:var(--sp-up)}.spbar>i.neg{background:var(--sp-down)}
.spbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--bone-faint)}
.u-sp{display:flex;justify-content:space-between;font-size:10.5px;color:var(--bone-dim);gap:4px;flex-wrap:wrap}
.u-sp b{font-family:var(--f-num);color:var(--bone)}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:4px}
.chip{font-size:10.5px;padding:0 5px;border:1px solid var(--line-hi);color:var(--bone-dim);cursor:help;white-space:nowrap}
.chip.block{border-color:var(--blockc);color:var(--blockc)}
.chip.bleed,.chip.burn{border-color:#8f3a30;color:#ef9a8c}
.chip.vuln,.chip.weak{border-color:#7a5aa0;color:#c9b0ea}
.chip.power{border-color:var(--brass-dim);color:var(--brass)}
.chip.guard,.chip.stag,.chip.panic{border-color:var(--brass);color:var(--brass)}
.chip.panic{border-color:var(--sp-down);color:#f19ab9}
.movebar{display:flex;gap:4px}
.movebar .btn{flex:1;padding:4px 2px;font-size:11px}
.intent{border:1px solid var(--line-hi);background:#120d0e;padding:5px 7px;font-size:11.5px;line-height:1.35;min-height:44px}
.intent .in-name{font-weight:700;color:var(--bone)}
.intent.atk{border-color:#6e2d27}.intent.stress{border-color:#6b2f52}.intent.cancel{opacity:.5;text-decoration:line-through}
.intent .clash{display:block;margin-top:3px;color:var(--brass);font-weight:700}
.dmgpop{position:absolute;right:6px;top:22px;font:700 20px var(--f-num);color:#ff8f80;text-shadow:0 2px 0 #000;pointer-events:none;animation:pop .9s ease-out forwards}
.dmgpop.heal{color:#a9e39a}.dmgpop.blk{color:var(--blockc)}
@keyframes pop{from{transform:translateY(4px);opacity:1}to{transform:translateY(-22px);opacity:0}}
.unit.hit{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* hand */
.hint{font-size:13px;color:var(--bone-dim);min-height:20px}
.hint b{color:var(--brass)}
.handbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
@media (max-width:760px){.handbar{grid-template-columns:auto auto;}.handbar .hand{grid-column:1/-1;order:3}}
.energy{width:62px;height:62px;border-radius:50%;border:2px solid var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,#3a2b12,#140e08)}
.energy b{font:600 22px/1 var(--f-num);color:var(--brass)}
.energy span{font-size:9.5px;color:var(--bone-faint);letter-spacing:.1em}
.piles{font-size:11.5px;color:var(--bone-dim);display:flex;flex-direction:column;gap:2px}
.piles b{font-family:var(--f-num);color:var(--bone)}
.hand{display:flex;gap:8px;overflow-x:auto;padding:16px 4px 8px 12px;min-height:214px;align-items:flex-start}
.endcol{display:flex;flex-direction:column;gap:8px;align-items:stretch}

/* cards (낡은 종이) */
.card{flex:none;width:136px;min-height:192px;display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 9px 8px 13px;position:relative;cursor:pointer;
  background:linear-gradient(165deg,var(--paper) 0%,var(--paper-2) 100%);color:var(--ink);border:1px solid #8a7656;border-left:5px solid var(--sin);border-radius:2px;
  transition:transform .12s, box-shadow .12s}
.card:hover{transform:translateY(-4px)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 0 2px var(--brass),0 8px 18px #000a}
.card.off{filter:grayscale(.85) brightness(.62);cursor:not-allowed}
.card.off:hover{transform:none}
.card .cost{position:absolute;top:-8px;left:-9px;width:26px;height:26px;border-radius:50%;background:#1b1209;border:2px solid var(--brass);color:var(--brass);font:600 13px/22px var(--f-num);text-align:center}
.card .c-owner{font-size:10.5px;font-weight:700;color:var(--ink-dim);padding-left:12px;letter-spacing:.04em}
.card .c-name{font-family:var(--f-display);font-weight:900;font-size:15px;line-height:1.2}
.card .c-type{font-size:10.5px;color:var(--ink-dim)}
.card .c-desc{font-size:11.5px;line-height:1.4;flex:1;display:flex;flex-direction:column;gap:2px}
.card .c-desc em{font-style:normal;font-weight:700}
.card .c-pos{font-size:10px;color:var(--ink-dim);border-top:1px solid #a8946f;padding-top:3px}
.card .why{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg);background:#1b1209;color:#f2c9a0;font-size:11px;font-weight:700;padding:2px 7px;white-space:nowrap}
.card .price{font:600 12px var(--f-num);color:#1b1209;background:var(--brass);align-self:flex-start;padding:1px 6px}
.card.r-rare{box-shadow:inset 0 0 0 1px #b8892a}
.card.up .c-name{color:#3c5a1e}

/* log */
.log{background:#0c0909;border:1px solid var(--line);padding:10px;font-size:12px;line-height:1.5;max-height:150px;overflow-y:auto;min-width:0}
.log p{margin:0 0 3px}
.log .lc{color:var(--brass)}.log .lb{color:#ef9a8c}.log .lg{color:#a9e39a}.log .ls{color:#f19ab9}.log .lt{color:var(--bone-faint);border-top:1px solid var(--line);padding-top:3px;margin-top:5px}
.coin{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--brass);margin-right:1px;vertical-align:-1px}
.coin.h{background:var(--brass)}

/* map */
.mapwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.side-panel{display:flex;flex-direction:column;gap:12px}
.mini{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--sin);background:var(--panel);text-align:left;width:100%}
.mini.clickable{cursor:pointer}.mini.targetable{outline:2px dashed var(--brass)}
.mini-top{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.mini-top b{font-family:var(--f-display);font-size:14px}
.mapbox{background:var(--panel);border:1px solid var(--line);overflow:auto;max-height:78vh}
.mapbox svg{display:block;width:100%;max-width:520px;margin:0 auto;height:auto}
.node{cursor:default}
.node.reach{cursor:pointer}
.node.reach circle.ring{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.35}}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:12px;color:var(--bone-dim)}
.legend span b{display:inline-block;width:18px;font-family:var(--f-display);color:var(--bone)}

/* screens */
.screen{display:flex;flex-direction:column;gap:16px}
.center{max-width:860px;margin:0 auto;width:100%}
.cards-grid{display:flex;flex-wrap:wrap;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border:1px solid var(--line-hi);background:var(--raise);cursor:pointer}
.tile:hover:not(:disabled){border-color:var(--brass)}
.tile:disabled{opacity:.4;cursor:not-allowed}
.tile h3{font-size:17px}
.tile p{margin:0;font-size:13px;color:var(--bone-dim)}
.tile .req{font-size:11.5px;color:var(--brass)}
.result-box{border-left:3px solid var(--brass);padding:10px 14px;background:var(--raise)}

/* title */
.title{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;padding-block:4vh}
@media (max-width:760px){.title{grid-template-columns:minmax(0,1fr)}.mirror{order:-1;max-width:220px;margin:0 auto}}
.title h1{font-size:clamp(44px,8vw,86px);line-height:.95}
.title h1 small{display:block;font-size:.3em;letter-spacing:.32em;color:var(--brass);font-weight:600;margin-top:12px}
.title .lede{max-width:46ch;color:var(--bone-dim);font-size:15px}
.disclaimer{font-size:12px;color:var(--bone-faint);border-top:1px solid var(--line);padding-top:10px;max-width:60ch}
.mirror svg{width:100%;height:auto;display:block}

/* select */
.sel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pick{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-top:3px solid var(--sin);background:var(--panel);cursor:pointer;position:relative}
.pick:hover{border-color:var(--line-hi);border-top-color:var(--sin)}
.pick.on{background:#251c14;outline:2px solid var(--brass)}
.pick .order{position:absolute;top:10px;right:12px;font:600 13px var(--f-num);color:var(--brass)}
.pick h3{font-size:20px}
.pick .meta{font-size:12px;color:var(--bone-dim)}
.pick .trait{font-size:12.5px}
.pick .trait b{color:var(--brass)}
.formation{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fslot{border:1px solid var(--line);padding:8px;min-height:74px;display:flex;flex-direction:column;gap:4px;background:var(--panel);font-size:12px}
.fslot b{font-family:var(--f-display);font-size:15px}
.fslot .warn{color:#f0b4ac;font-size:11px}

/* modal + toast */
#modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal-box{background:var(--panel);border:1px solid var(--line-hi);max-width:880px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-box h2{font-size:22px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 22px;font-size:13px}
.rules h3{font-size:15px;color:var(--brass);margin-bottom:3px}
.rules p{margin:0;color:var(--bone-dim)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b1209;border:1px solid var(--brass);color:var(--bone);padding:8px 14px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
/* 기프트 목록 */
.glist{display:grid;gap:6px}
.gitem{display:flex;flex-direction:column;gap:2px;padding:6px 9px;border:1px solid var(--line);border-left:3px solid var(--brass);background:var(--panel)}
.gitem b{color:var(--brass);font-size:13px}
.gitem span{font-size:12px;color:var(--bone-dim);line-height:1.4}
.cside{display:flex;flex-direction:column;gap:8px;min-width:0}
.card.benched{filter:grayscale(.7) brightness(.7)}
/* 테마 팩 */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.packcard{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--sin)}
.packcard h3{font-size:22px}
.packinfo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0;font-size:13px}
.packinfo dt{color:var(--bone-faint);font-size:12px}
.packinfo dd{margin:0}
.giftlist{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--bone-dim);display:grid;gap:3px}
.giftlist b{color:var(--brass)}
.packcard .btn{margin-top:auto}
/* 행동 강조 */
.unit{transition:transform .2s ease, box-shadow .2s ease}
.partyside .unit.acting{transform:translate(10px,-6px);box-shadow:0 0 0 2px var(--brass),0 0 22px #d8ab3e55}
.enemyside .unit.acting{transform:translate(-10px,-6px);box-shadow:0 0 0 2px var(--brass),0 0 22px #d8ab3e55}
.unit.targeted{box-shadow:0 0 0 2px var(--blood),0 0 18px #c33b2e66}
.unit.hit{animation:shake .32s, hitflash .45s}
@keyframes hitflash{0%{background:#5a1c18}100%{background:var(--panel)}}
/* 코인 연출 패널 */
#stage{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;width:min(640px,calc(100% - 32px));cursor:pointer}
.stg{background:linear-gradient(180deg,#221a1c,#120d0e);border:1px solid var(--brass-dim);box-shadow:0 20px 50px #000d,0 0 0 1px #000;padding:12px 14px 8px;display:grid;gap:10px;animation:stgin .18s ease-out}
@keyframes stgin{from{transform:translateY(14px);opacity:0}}
.stg-head{font-family:var(--f-display);font-weight:900;font-size:15px;text-align:center;color:var(--bone)}
.stg-skip{font-size:10.5px;color:var(--bone-faint);text-align:right}
.duel{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:8px;align-items:stretch}
.duel.single{grid-template-columns:minmax(0,1fr);max-width:340px;width:100%;margin:0 auto}
.dside{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 8px;border:1px solid var(--line);border-top:3px solid var(--sin);background:#140f10;transition:background .2s,border-color .2s,opacity .25s,transform .2s;min-width:0;text-align:center}
.dside.rwin{background:#2b2213;border-color:var(--brass);border-top-color:var(--sin);transform:scale(1.03)}
.dside.rlose{opacity:.7}
.dside.win{background:#2f2412;border-color:var(--brass);border-top-color:var(--sin);transform:scale(1.05)}
.dside.lose{opacity:.4;transform:scale(.96)}
.dname{font-family:var(--f-display);font-weight:900;font-size:15px;overflow-wrap:anywhere}
.dskill{font-size:11.5px;color:var(--bone-dim)}
.dtotal{font:600 38px/1 var(--f-num);color:var(--brass);margin:2px 0}
.dtotal.bump{animation:bump .24s ease-out}
@keyframes bump{50%{transform:scale(1.3);color:#fff2c4}}
.dcoins{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px;align-items:center;margin-top:10px}
.dsub{font-size:10.5px;color:var(--bone-faint)}
.c3{width:30px;height:30px;border-radius:50%;border:2px solid var(--brass-dim);background:radial-gradient(circle at 40% 35%,#2a1f14,#120c08);display:inline-flex;align-items:center;justify-content:center;font:600 11px var(--f-num);color:var(--brass-dim)}
.c3::after{content:'?'}
.c3.toss{animation:toss .3s ease-in-out;border-color:var(--brass)}
.c3.h{background:radial-gradient(circle at 35% 30%,#ffe7a0,#d8ab3e 55%,#7d5c1c);border-color:#ffe7a0;color:#2a1a05;box-shadow:0 0 12px #d8ab3e88}
.c3.h::after{content:attr(data-cp)}
.c3.t{background:#231b1a;border-color:#5c4744;color:var(--bone-faint)}
.c3.t::after{content:'0'}
.c3.big{width:58px;height:58px;font-size:12px;border-width:3px}
.c3.chk::after{content:'?'}.c3.chk.h::after{content:'성공'}.c3.chk.t::after{content:'실패'}
.okc{color:var(--brass)}.failc{color:#ef9a8c}
.c3.gone{animation:shatter .4s forwards}
@keyframes toss{0%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-16px) scaleX(.12)}50%{transform:translateY(-22px) scaleX(1)}75%{transform:translateY(-12px) scaleX(.12)}100%{transform:translateY(0) scaleX(1)}}
@keyframes shatter{0%{transform:scale(1)}40%{transform:scale(1.2) rotate(-12deg);border-color:var(--blood)}100%{transform:scale(.5) rotate(30deg);opacity:.15;border-color:var(--blood)}}
.vsx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.vsx b{font-family:var(--f-display);font-size:22px;color:var(--brass)}
.vsx span{font-size:11px;color:var(--bone-dim);font-family:var(--f-num)}
.verdict{text-align:center;font-size:13px;color:var(--bone-dim);min-height:20px}
.verdict.big{font-size:17px;color:var(--bone);padding:6px 0 4px}
.verdict.hitv,.verdict.winv{color:var(--brass);font-size:16px;font-weight:700}
.verdict.losev{color:#ef9a8c;font-size:16px;font-weight:700}
.verdict .ls{color:#f19ab9}
@media (max-width:480px){.duel{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr)}.dtotal{font-size:30px}.c3{width:24px;height:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const Stage={
  el:null, cfg:{},
  on(){ return !FAST&&A.speed>0&&!A.skip&&!!this.el; },
  open(html){ this.el.innerHTML=`<div class="stg">${html}<div class="stg-skip">누르면 연출을 건너뛴다</div></div>`; this.el.hidden=false; },
  close(){ if(!this.el) return; this.el.hidden=true; this.el.innerHTML=''; this.cfg={}; },
  side(key,o){
    this.cfg[key]=o;
    return `<div class="dside ${o.ally?'ally':'foe'}" data-side="${key}" style="--sin:${o.sin||'var(--brass)'}">

    const sd=this.el&&this.el.querySelector(`[data-side="${key}"]`); const o=this.cfg[key]; if(!sd||!o) return;

      c.classList.remove('toss'); c.classList.add(r.heads[i]?'h':'t');
      if(r.heads[i]){ t+=o.cp; tot.textContent=t; tot.classList.remove('bump'); void tot.offsetWidth; tot.classList.add('bump'); }
      await T(130);

  verdict(txt,cls=''){ const v=this.el&&this.el.querySelector('[data-v]'); if(v){ v.className='verdict '+cls; v.innerHTML=txt; } },
  async single(o){

    this.open(`<div class="stg-head">합</div><div class="duel">${this.side('L',Lo)}<div class="vsx"><b>VS</b><span data-round>준비</span></div>${this.side('R',Ro)}</div><div class="verdict" data-v>코인을 던져 위력이 낮은 쪽이 코인 1개를 잃는다</div>`);

    if(!this.on()) return;

    const L=this.el.querySelector('[data-side="L"]'), R=this.el.querySelector('[data-side="R"]');

    win.classList.add('rwin'); lose.classList.add('rlose');

    this.verdict(`${res>0?this.cfg.L.name:this.cfg.R.name} 우세 · 상대 코인 1개 파괴`);

    await T(320); await this.flip('L',sr); await T(180);
    const Ls=this.el.querySelector('[data-side="L"]'), Rs=this.el.querySelector('[data-side="R"]');
    if(ev){ (ok?Ls:Rs).classList.add('win'); (ok?Rs:Ls).classList.add('lose'); this.verdict(ok?`회피 성공! ${sr.total} ≥ ${r.total}`:`회피 실패 · ${sr.total} < ${r.total}`,ok?'winv':'losev'); }
    else { Ls.classList.add('win'); this.verdict(`수비 · 위력 ${Math.min(sr.total,r.total)} 막음`,'winv'); }
    await T(620);

  async check(sid,sinKey,pct,ok){
    if(!this.on()) return;
    this.open(`<div class="stg-head">판정 · ${SINS[sinKey]}</div><div class="duel single"><div class="dside ally" data-side="S" style="--sin:var(--sin-${sinKey})"><div class="dname">${sname(sid)}</div><div class="dskill">성공 확률</div><div class="dtotal num">${pct}%</div><div class="dcoins"><span class="c3 big chk" data-cp="성공"></span></div></div></div><div class="verdict" data-v>코인이 앞면이면 성공</div>`);
    const c=this.el.querySelector('.c3'); await T(300);

    c.classList.remove('h','t'); c.classList.add('toss'); await T(360); c.classList.remove('toss'); c.classList.add(ok?'h':'t');
    this.verdict(ok?'판정 성공!':'판정 실패…',ok?'winv':'losev'); await T(800);

    if(!this.on()) return;

function cdef(inst){
  const base=CARDS[inst.id]; if(!base) return null;
  const fx=JSON.parse(JSON.stringify(base.fx));
  let cost=base.cost;
  if(inst.up){ if(base.up) base.up(fx); if(base.upCost!=null) cost=base.upCost; }
  return {...base, id:inst.id, fx, cost, up:!!inst.up, name:base.name+(inst.up?'+':'')};
}
const canUpgrade=inst=>!inst.up && CARDS[inst.id] && (CARDS[inst.id].up||CARDS[inst.id].upCost!=null);

function fxLine(f,d){
  const tgtWord=d.target==='ally'?'대상 아군':d.target==='allAllies'?'아군 모두':d.target==='self'?'자신':d.target==='allEnemies'?'적 모두':'대상';
  const who=f.to==='self'?'자신':f.to==='allAllies'?'아군 모두':f.to==='allEnemies'?'적 모두':tgtWord;
  switch(f.t){
    case 'atk':{
      let s=`<em>위력 ${f.base} + 코인 ${f.coinsX?`(X+${f.coins})`:f.coins}개×${f.cp}</em>`;
      if(f.timesX) s+=` <em>X번</em>`; else if(f.times>1) s+=` <em>${f.times}번</em>`;
      if(d.target==='allEnemies') s=`${posTxt(d.tpos)} 적 모두에게 `+s;
      if(f.spScale) s+=`<br>SP가 음수면 5당 위력 +1`;
      if(f.per) s+=`<br>대상의 ${STATUS[f.per.s].n} 1당 위력 +${f.per.n}`;
      return s;}
    case 'block': return `${who} 방어도 <em>${f.n}</em>`;
    case 'stance': return f.k==='evade'
      ? `<em>회피 ${f.base} + 코인 ${f.coins}개×${f.cp}</em><br>이번 라운드 공격을 받으면 위력을 겨룬다. 같거나 높으면 피해 0, 다음 공격도 계속 회피`
      : `<em>수비 ${f.base} + 코인 ${f.coins}개×${f.cp}</em><br>이번 라운드 처음 받는 공격의 피해를 굴린 수치만큼 줄인다`;
    case 'heal': return `${who} 체력 <em>${f.n}</em> 회복`;
    case 'draw': return `카드 <em>${f.n}</em>장 뽑기`;
    case 'energy': return `에너지 <em>+${f.n}</em>`;
    case 'sp': return `${f.to?who:(d.target==='self'?'자신':who)} SP <em>${f.n>0?'+':''}${f.n}</em>`;
    case 'status': return `${f.to==='self'?'자신에게':(d.target==='allEnemies'?'적 모두에게':'대상에게')} ${STATUS[f.s].n} <em>${f.n}</em>`;
    case 'power': return `${f.to?who:'자신'} 위력 <em>+${f.n}</em> (전투 동안)`;
    case 'guard': return `대상 아군을 <em>엄호</em>: 이번 라운드 그 아군을 노린 공격을 대신 받는다`;
    case 'move': return f.to===1?`<em>1열로 이동</em>한 뒤`:`앞으로 <em>1칸 이동</em>`;
    case 'selfdmg': return `자신 체력 -${f.n}`;
    case 'cleanse': return `출혈·화상 제거`;
    case 'dmg': return `${d.target==='allEnemies'?'적 모두에게':'대상에게'} 피해 <em>${f.n}</em> (코인 없음)`;
    case 'aura': return auraText(f.k,f.n);
  }
  return '';
}
function auraText(k,n){
  return {drawEach:`매 턴 카드 <em>${n}</em>장 더 뽑기`,powerEach:`매 턴 시작 시 자신 위력 <em>+${n}</em>`,regenAll:`매 턴 시작 시 아군 모두 체력 <em>${n}</em> 회복`,
    frontBlock:`매 턴 시작 시 1열 수감자 방어도 <em>${n}</em>`,weakAura:`매 턴 시작 시 적 모두 약화 <em>${n}</em>`,
    rageOnHit:`자신이 피해를 받을 때마다 위력 <em>+${n}</em>`,counterBleed:`수감자가 공격받아 피해를 입으면 공격한 적에게 출혈 <em>${n}</em>`}[k]||'';
}
const KEYWORDS={innate:['선천성','전투 첫 손패에 반드시 들어온다.'],retain:['보존','턴이 끝나도 버려지지 않고 손에 남는다.'],ethereal:['휘발','턴이 끝날 때 손에 있으면 소멸한다.'],exhaust:['소멸','쓰면 이번 전투에서 사라진다.']};
function descHTML(d){
  const kw=['innate','retain','ethereal'].filter(k=>d[k]).map(k=>`<em>${KEYWORDS[k][0]}</em>`);
  const lines=kw.length?[kw.join(' · ')]:[];
  if(d.type==='파워') lines.push('<em>파워</em>: 이번 전투 동안 유지');
  lines.push(...d.fx.map(f=>fxLine(f,d)).filter(Boolean));
  if(d.note) lines.push(d.note);
  if(d.exhaust) lines.push('<em>소멸</em>');
  return lines.map(l=>`<span>${l}</span>`).join('');
}
function posLine(d){
  if(!d.owner) return d.neutral?'무색 · 누구나 사용':d.type;
  let s=`사용 ${posTxt(d.from)}`;
  if(d.target==='enemy') s+=` · 대상 적 ${posTxt(d.tpos)}`;
  return s;
}

/* =========================================================
   5. 지도 생성
   ========================================================= */
const ROWS=7, COLS=4;
function genMap(pack){
  const evW=Math.round(22*((pack&&pack.perk.event)||1));
  const nodes={}, edges=[];
  const node=(r,c)=>{const id=`${r}-${c}`; if(!nodes[id]) nodes[id]={id,r,c,type:null,next:[]}; return nodes[id];};
  const crosses=(r,a,b)=>edges.some(([r0,x,y])=>r0===r&&((x<a&&y>b)||(x>a&&y<b)));
  const starts=shuffle([0,1,2,3]).slice(0,3); starts.push(ri(0,COLS-1));
  for(const s of starts){
    let c=s; node(0,c);
    for(let r=0;r<ROWS-1;r++){
      const opts=shuffle([c-1,c,c+1].filter(x=>x>=0&&x<COLS));
      const nc=opts.find(x=>!crosses(r,c,x)) ?? c;
      if(!edges.some(e=>e[0]===r&&e[1]===c&&e[2]===nc)) edges.push([r,c,nc]);
      node(r+1,nc); c=nc;
    }
  }
  for(const [r,a,b] of edges){ const n=nodes[`${r}-${a}`]; const id=`${r+1}-${b}`; if(!n.next.includes(id)) n.next.push(id); }
  nodes.B={id:'B',r:ROWS,c:1.5,type:'boss',next:[]};
  Object.values(nodes).forEach(n=>{ if(n.r===ROWS-1) n.next=['B']; });
  // 종류 배정
  const parents=id=>Object.values(nodes).filter(n=>n.next.includes(id));
  const roll=r=>{
    const bag=[['combat',45],['event',evW],['supply',6]];
    if(r>=2){bag.push(['elite',11]);bag.push(['shop',8]);}
    if(r>=2&&r<=4) bag.push(['rest',9]);
    let t=rnd()*bag.reduce((a,b)=>a+b[1],0);
    for(const [k,w] of bag){ if((t-=w)<0) return k; } return 'combat';
  };
  const ordered=Object.values(nodes).filter(n=>n.id!=='B').sort((a,b)=>a.r-b.r);
  for(const n of ordered){
    if(n.r===0){n.type='combat';continue;}
    if(n.r===ROWS-1){n.type='rest';continue;}
    let t, tries=0;
    do{ t=roll(n.r); tries++; } while(tries<8 && ['elite','rest','shop'].includes(t) && parents(n.id).some(p=>p.type===t));
    n.type=t;
  }
  const force=(type)=>{
    if(ordered.some(n=>n.type===type)) return;
    const cand=ordered.filter(n=>n.r>=2&&n.r<=5&&n.type==='combat');
    if(cand.length) pick(cand).type=type;
  };
  force('elite'); force('shop');
  return {nodes};
}
function reachable(){
  if(!S) return [];
  if(!S.cur) return Object.values(S.map.nodes).filter(n=>n.r===0).map(n=>n.id);
  if(!S.visited.includes(S.cur)) return [];
  return S.map.nodes[S.cur].next.slice();
}

function newRun(formation){
  const party={};
  for(const id of formation){ const d=SINNERS[id]; party[id]={id,hp:d.hp,max:d.hp,sp:spRule(id).start,down:false,gone:false}; }
  const deck=[];
  for(const id of formation) for(const [cid,c] of Object.entries(CARDS)) if(c.owner===id) for(let k=0;k<(c.starter||0);k++) deck.push(mkCard(cid));
  S={v:2,screen:'pack',party,formation:formation.slice(),deck,gifts:[],cons:['heal'],enk:60,clocks:2,
     floor:1,pack:null,usedPacks:[],packChoices:null,floorMsg:'',
     map:null,cur:null,visited:[],seenEvents:[],stats:{kills:0,nodes:0,turns:0},reward:null,event:null,rest:null,shop:null,supply:null};
  S.packChoices=rollPacks();
  save();
}
function rollPacks(){
  const left=Object.keys(PACKS).filter(k=>!S.usedPacks.includes(k));
  const src=left.length>=3?left:Object.keys(PACKS);
  return shuffle(src.slice()).slice(0,3);
}
function choosePack(id){
  if(!S||S.screen!=='pack'||!S.packChoices.includes(id)) return;
  S.pack=id; S.usedPacks.push(id);
  S.map=genMap(PACKS[id]); S.cur=null; S.visited=[]; S.floorMsg='';
  if(PACKS[id].perk.calm&&S.cons.length<3) S.cons.push('calm');
  S.screen='map'; save(); render();
}
function nextFloor(){
  S.floor++;
  S.formation.forEach(sid=>{ const p=S.party[sid]; p.hp=Math.min(p.max,p.hp+Math.ceil(p.max*.35)); });
  S.floorMsg=`${S.floor-1}층 돌파. 수감자 모두 체력을 35% 회복했다.`;
  S.pack=null; S.map=null; S.cur=null; S.visited=[];
  S.packChoices=rollPacks(); S.screen='pack';
  save(); render();
}
const pack=()=>PACKS[S.pack];
const MIN_DECK_=10;
const activeDeck=()=>S.deck.filter(c=>!c.off);
const minDeck=()=>Math.min(MIN_DECK_,S.deck.length);   // 카드가 원래 적으면 가진 만큼만 요구
const alive=()=>S.formation.slice();
const has=g=>S.gifts.includes(g);
const L=(html,cls='')=>{ if(C){ C.log.push({html,cls}); if(C.log.length>140) C.log.shift(); } };

function enterNode(id){
  if(!reachable().includes(id)) return;
  const n=S.map.nodes[id];
  UI.sel=null; UI.selUnit=null; UI.cons=null;
  if(n.type==='combat'||n.type==='elite'||n.type==='boss'){ S.prep={node:id}; S.screen='prep'; save(); render(); return; }
  S.cur=id; S.stats.nodes++;
  if(n.type==='event'){ S.event={id:pickEvent(),result:null,picking:null}; S.screen='event'; save(); }
  else if(n.type==='rest'){ S.rest={done:null,picking:false}; S.screen='rest'; save(); }
  else if(n.type==='shop'){ S.shop=genShop(); S.screen='shop'; save(); }
  else if(n.type==='supply'){ S.supply=doSupply(); S.screen='supply'; save(); }
  render();
}
function startPrepared(){
  const id=S.prep&&S.prep.node; if(!id||!reachable().includes(id)) return;
  if(activeDeck().length<minDeck()){ toast(`가져갈 카드가 ${minDeck()}장 이상이어야 한다`); return; }
  S.cur=id; S.stats.nodes++; S.prep=null; S.screen='combat'; save();
  startCombat(S.map.nodes[id]); render();
}
function completeNode(){
  if(!S.visited.includes(S.cur)) S.visited.push(S.cur);
  if(S.map.nodes[S.cur]&&S.map.nodes[S.cur].type==='boss'){ S.reward=null; UI.sel=UI.selUnit=UI.cons=null; nextFloor(); return; }
  S.screen='map'; S.reward=S.event=S.rest=S.shop=S.supply=null;
  UI.sel=UI.selUnit=UI.cons=null;
  save(); render();
}
function endRun(win){
  S.screen='result'; S.result={win};
  C=null; save(); render();
}

   7. 전투 규칙
   ========================================================= */
const chance=sid=>clamp(50+S.party[sid].sp,5,95);
function roll(base,coins,cp,ch){
  const heads=[]; let total=base;
  for(let i=0;i<coins;i++){ const h=rnd()*100<ch; heads.push(h); if(h) total+=cp; }
  return {heads,total:Math.max(0,total)};
}
const coinHTML=r=>r.heads.map(h=>`<span class="coin${h?' h':''}"></span>`).join('');
const sname=sid=>SINNERS[sid].name;
const spRule=sid=>({...SP_RULE,...(SINNERS[sid].sp||{})});
const spRuleTxt=sid=>{ const r=spRule(sid); const t=[`합 승리 +${r.clashWin}`,`적 처치 +${r.kill}`,`동료가 쓰러짐 ${r.allyDown}`]; if(r.clashLose) t.push(`합 패배 ${r.clashLose}`); if(r.lossMul!==1) t.push(`잃는 SP ×${r.lossMul}`); return t.join(' · '); };
const spTier=sp=>sp<=SP_MIN?'패닉 직전':sp<=-25?'동요':sp>=25?'고양':'평정';

function mkEnemy(id){
  const D=ENEMIES[id]; const lv=Math.max(0,(S.floor||1)-1);
  const hp=Math.round(ri(D.hp[0],D.hp[1])*(1+.2*lv));   // 층마다 체력 +20%, 3층부터 위력 +1
  return {uid:uid(),id,name:D.name,hp,max:hp,block:0,st:{},power:lv>=2?1:0,stag:D.stag.slice(),staggered:false,intent:null,mi:0,phase:0};
}
function startCombat(node){
  const kind=node.type==='boss'?'boss':node.type==='elite'?'elite':(node.r<=1?'easy':'hard');
  const ids=kind==='boss'?[pack().boss]:pick(pack().enc[kind]);
  const draw=shuffle(S.deck.filter(c=>{const o=CARDS[c.id].owner; return !c.off&&(!o||S.formation.includes(o));}).map(c=>({...c})));
  draw.sort((a,b)=>(CARDS[a.id].innate?1:0)-(CARDS[b.id].innate?1:0));   // 선천성 카드는 맨 위(먼저 뽑힘)
  C={kind,enemies:ids.map(mkEnemy),u:{},auras:[],draw,hand:[],disc:[],exh:[],locked:[],energy:0,round:1,busy:false,over:null,finished:false,
     log:[],firstAtk:false,clashBonus:false,fx:{}};
  for(const sid of S.formation){
    C.u[sid]={block:0,st:{},guardBy:null,panic:false};
    const p=S.party[sid];
    if(has('branch')) p.sp=clamp(p.sp+10,SP_MIN,SP_MAX);   // SP는 전투가 끝나도 유지된다
  }
  if(has('wax')) C.enemies.forEach(e=>{e.st.burn=(e.st.burn||0)+2;});
  L(`<b>${C.enemies.map(e=>e.name).join(', ')}</b> 등장`,'lt');
  startPlayerTurn(true);
}
function addFx(id,kind,n){ C.fx[id]={kind,n,t:Date.now()}; }

function drawCards(n){
  let got=0, guard=0;
  while(got<n && guard++<60){
    if(C.hand.length>=10){ L('손패가 가득 차서 더 뽑지 못했다.'); break; }
    if(!C.draw.length){
      if(!C.disc.length) break;
      C.draw=shuffle(C.disc); C.disc=[]; L('버림 더미를 섞어 다시 뽑을 더미로 만들었다.','lt');
    }
    const c=C.draw.pop(); const o=CARDS[c.id].owner;
    if(o && !S.formation.includes(o)){ C.locked.push(c); continue; }
    C.hand.push(c); got++;
  }
}
function pickTarget(rule){
  const f=S.formation; if(!f.length) return null;
  if(rule==='front') return pick(f.slice(0,2));
  if(rule==='back') return f.length>2?pick(f.slice(2)):pick(f);
  if(rule==='lowSp') return f.slice().sort((a,b)=>S.party[a].sp-S.party[b].sp)[0];
  return pick(f);
}
function chooseIntent(e){
  const D=ENEMIES[e.id];
  if(e.staggered){ e.intent={type:'stagger',name:'흐트러짐',cancelled:false,used:false}; return; }
  const moves=D.phases?D.phases[e.phase]:D.moves;
  let m=moves[e.mi%moves.length]; e.mi++;
  if(m.type==='summon'&&C.enemies.length>=4){ m=moves[e.mi%moves.length]; e.mi++; }
  const it=JSON.parse(JSON.stringify(m)); it.cancelled=false; it.used=false;
  if(['atk','debuff','stress'].includes(m.type)&&m.tgt!=='all') it.target=pickTarget(m.tgt);
  e.intent=it;
}
function resolvedTarget(e){
  const it=e.intent; if(!it||it.tgt==='all') return null;
  if(!it.target||!S.formation.includes(it.target)) it.target=pickTarget(it.tgt||'any');
  let t=it.target;
  const g=t&&C.u[t]&&C.u[t].guardBy;
  if(g&&S.formation.includes(g)) t=g;
  return t;
}
function intentText(e){
  const it=e.intent; if(!it) return {cls:'',html:'…'};
  if(it.type==='stagger') return {cls:'cancel',html:`<span class="in-name">흐트러짐</span><br>이번 라운드 행동 불가`};
  const tg=it.tgt==='all'?'수감자 모두':(resolvedTarget(e)?sname(resolvedTarget(e)):'—');
  const pw=e.power||0;
  let h=`<span class="in-name">${it.name}</span><br>`, cls='';
  if(it.type==='atk'){ cls='atk'; h+=`공격 <b class="num">${it.base+pw}~${it.base+pw+it.coins*it.cp}</b> → ${tg}`; if(it.st) h+=` · ${STATUS[it.st.s].n} ${it.st.n}`; }
  else if(it.type==='stress'){ cls='stress'; h+=`SP <b class="num">-${it.sp}</b> → ${tg}`; }
  else if(it.type==='block'){ h+=`방어도 ${it.block}${it.power?` · 위력 +${it.power}`:''}`; }
  else if(it.type==='buff'){ h+=`적 모두 위력 +${it.power}`; }
  else if(it.type==='debuff'){ h+=`${STATUS[it.st.s].n} ${it.st.n} → ${tg}`; }
  else if(it.type==='push'){ h+=`진형을 뒤집고 덱에 균열 ${it.cards}장`; }
  else if(it.type==='summon'){ h+=`${ENEMIES[it.unit||'shard'].name} ${it.n}명 소환`; }
  if(it.cancelled) cls+=' cancel';
  return {cls,html:h};
}

function canClash(e,sid){
  const it=e.intent;
  return !!(it&&it.type==='atk'&&!it.cancelled&&!it.used&&!e.staggered&&it.tgt!=='all'&&S.formation.includes(sid));
}
function atkBonus(sid,f,e){
  let b=C.u[sid].st.power||0; const sp=S.party[sid].sp;
  if(sid==='heath'&&sp<0) b+=2;
  if(f.spScale&&sp<0) b+=Math.floor(-sp/5);
  if(f.per&&e) b+=(e.st[f.per.s]||0)*f.per.n;
  if(has('hook')&&e&&(e.st.bleed||0)>0) b+=2;
  return b;
}
function outMod(n,attSt,tgtSt,stag){
  let m=n; if((attSt.weak||0)>0) m*=0.75; if((tgtSt.vuln||0)>0) m*=1.5; if(stag) m*=1.5; return Math.floor(m);
}
function spChange(sid,n){
  const p=S.party[sid]; if(!p||p.down||p.gone) return;
  if(n<0) n=Math.trunc(n*spRule(sid).lossMul);
  p.sp=clamp(p.sp+n,SP_MIN,SP_MAX);
}
function bleedTick(st,onDmg){
  const b=st.bleed||0; if(b<=0) return false;
  st.bleed=b-1; onDmg(b); return true;
}

function dealToEnemy(e,dmg,src){
  if(!C.enemies.includes(e)) return;
  let d=dmg; const blk=Math.min(e.block,d); e.block-=blk; d-=blk;
  e.hp-=d; addFx(e.uid,'hit',dmg);
  if(e.hp<=0){ killEnemy(e,src); return; }
  const D=ENEMIES[e.id];
  if(D.boss){ const r=e.hp/e.max, ph=r<=.33?2:r<=.66?1:0; if(ph>e.phase){ e.phase=ph; e.mi=0; L(`${e.name}의 모습이 일그러진다. (${ph+1}단계)`,'ls'); } }
  while(e.stag.length&&e.hp<=e.max*e.stag[0]){
    e.stag.shift();
    if(!e.staggered){ e.staggered=true; if(e.intent) e.intent.cancelled=true; L(`${e.name} <b>흐트러짐</b>: 행동 취소, 받는 피해 +50%`,'lc'); }
  }
}
function killEnemy(e,src){
  C.enemies=C.enemies.filter(x=>x!==e); S.stats.kills++;
  L(`${e.name} 처치`,'lc');
  if(has('candle')) S.formation.forEach(s=>spChange(s,4));
  if(src&&S.formation.includes(src)){ spChange(src,spRule(src).kill); if(has('chalice')) healSinner(src,4); }
  checkEnd();
}
function healSinner(sid,n){
  const p=S.party[sid]; if(!p||p.down) return; const before=p.hp; p.hp=Math.min(p.max,p.hp+n); if(C&&p.hp>before) addFx(sid,'heal',p.hp-before);
}
function dealToSinner(sid,dmg,ignoreBlock=false){
  if(!S.formation.includes(sid)) return;
  const u=C.u[sid], p=S.party[sid];
  let d=dmg;
  if(!ignoreBlock){ const blk=Math.min(u.block,d); u.block-=blk; d-=blk; }
  p.hp-=d; addFx(sid,'hit',dmg);
  if(d>0) for(const a of C.auras) if(a.k==='rageOnHit'&&a.owner===sid) u.st.power=(u.st.power||0)+a.n;
  if(p.hp<=0) sinnerDown(sid);
}
function sinnerDown(sid){
  const p=S.party[sid]; p.hp=0; p.down=true;
  S.formation=S.formation.filter(x=>x!==sid);
  L(`<b>${sname(sid)}</b> 전투 불능. 뒤에 있던 수감자가 앞으로 당겨진다.`,'lb');
  for(const o of S.formation) spChange(o,spRule(o).allyDown);
  for(const pile of ['hand','draw','disc']){
    const keep=[]; for(const c of C[pile]){ if(CARDS[c.id].owner===sid) C.locked.push(c); else keep.push(c); } C[pile]=keep;
  }
  if(UI.selUnit===sid) UI.selUnit=null;
  checkEnd();
}
function checkEnd(){
  if(C.over) return;
  if(!C.enemies.length) C.over='win';
  else if(!S.formation.length) C.over='lose';
  if(C.over){ UI.sel=null; UI.cons=null; }
}
function maybeFinish(){
  if(C&&C.over&&!C.finishQueued){ C.finishQueued=true; setTimeout(finishCombat, FAST?0:Math.round(650/(A.speed||2))); }
}

function startPlayerTurn(first=false){
  for(const sid of S.formation){ C.u[sid].block=0; C.u[sid].stance=null; }
  if(first){
    if(S.formation.includes('outis')) C.u.outis.block+=6;
    if(has('umbrella')) S.formation.forEach(s=>C.u[s].block+=4);
  }
  if(has('coffee')&&S.formation.length){ const low=S.formation.slice().sort((a,b)=>S.party[a].sp-S.party[b].sp)[0]; spChange(low,6); }
  for(const sid of S.formation){
    if(S.party[sid].sp<=SP_MIN){ C.u[sid].panic=true; L(`<b>${sname(sid)}</b> 패닉! 이번 턴 그 수감자의 카드를 쓸 수 없다.`,'ls'); }
  }
  let extraDraw=0;
  if(!first) for(const a of C.auras){
    if(a.owner&&!S.formation.includes(a.owner)) continue;
    if(a.k==='drawEach') extraDraw+=a.n;
    else if(a.k==='powerEach') C.u[a.owner].st.power=(C.u[a.owner].st.power||0)+a.n;
    else if(a.k==='regenAll') S.formation.forEach(s=>healSinner(s,a.n));
    else if(a.k==='frontBlock'&&S.formation[0]) C.u[S.formation[0]].block+=a.n;
    else if(a.k==='weakAura') C.enemies.forEach(e=>{e.st.weak=(e.st.weak||0)+a.n;});
  }
  C.energy=3+(first&&has('spring')?1:0);
  C.clashBonus=false;
  drawCards(5+extraDraw+(first&&S.formation.includes('faust')?1:0));
  for(const e of C.enemies) chooseIntent(e);
  L(`— 라운드 ${C.round} —`,'lt');
}

function canPlay(inst){
  const d=cdef(inst); if(!d) return {ok:false,why:'오류'};
  if(d.unplayable) return {ok:false,why:'사용 불가'};
  if(d.owner){
    if(!S.formation.includes(d.owner)) return {ok:false,why:'전투 불능'};
    if(C.u[d.owner].panic) return {ok:false,why:'패닉'};
    const pos=S.formation.indexOf(d.owner)+1;
    if(!d.from.includes(pos)) return {ok:false,why:`${pos}열에선 불가`};
  }
  if(d.cost!=='X'&&C.energy<d.cost) return {ok:false,why:'에너지 부족'};
  if(d.target==='enemy'&&!validEnemies(d).length) return {ok:false,why:'닿는 적 없음'};
  if(d.target==='allEnemies'&&!validEnemies(d).length) return {ok:false,why:'닿는 적 없음'};
  if(d.target==='ally'&&!validAllies(d).length) return {ok:false,why:'대상 없음'};
  return {ok:true};
}
const validEnemies=d=>C.enemies.filter((e,i)=>!d.tpos||d.tpos.includes(i+1));
const validAllies=d=>S.formation.filter(s=>!(d.noSelf&&s===d.owner));

async function playCard(u,targetId){
  if(!C||C.busy||C.over) return false;
  const inst=C.hand.find(c=>c.u===u); if(!inst) return false;
  const chk=canPlay(inst); if(!chk.ok){ toast(chk.why); return false; }
  const d=cdef(inst);
  let tgtE=null, tgtA=null;
  if(d.target==='enemy'){ tgtE=validEnemies(d).find(e=>e.uid===targetId); if(!tgtE) return false; }
  if(d.target==='ally'){ if(!validAllies(d).includes(targetId)) return false; tgtA=targetId; }
  // 비용 지불 → 손에서 빼기 → 효과
  const X=d.cost==='X'?C.energy:0;
  C.energy-=d.cost==='X'?X:d.cost;
  C.hand=C.hand.filter(c=>c!==inst);
  (d.exhaust||d.type==='파워'?C.exh:C.disc).push(inst);
  L(`${d.owner?sname(d.owner)+': ':''}<b>${d.name}</b>`);
  UI.sel=null; UI.selUnit=null; C.busy=true; A.skip=false;
  const cc=C; render();
  try{
    for(const f of d.fx){
      if(C!==cc||C.over) break;
      if(d.owner&&!S.formation.includes(d.owner)) break;
      await applyFx(f,d,d.owner,tgtE,tgtA,X);
    }
  }catch(err){ console.error(err); toast('오류: '+(err.message||err)); }
  finally{
    Stage.close();
    if(C===cc){ C.busy=false; C.actors=null; render(); maybeFinish(); }
  }
  return true;
}
async function applyFx(f,d,owner,tgtE,tgtA,X=0){
  const allyTargets=()=>{
    const to=f.to||(d.target==='ally'?'target':d.target==='allAllies'?'allAllies':'self');
    if(to==='self') return owner?[owner]:[];
    if(to==='allAllies') return S.formation.slice();
    return tgtA?[tgtA]:[];
  };
  switch(f.t){
    case 'atk': await sinnerAttack(owner,f,d,tgtE,X); return;
    case 'dmg':{ const list=d.target==='allEnemies'?C.enemies.slice():(tgtE&&C.enemies.includes(tgtE)?[tgtE]:[]);
      C.actors={a:owner,t:list.map(e=>e.uid)}; list.forEach(e=>{ L(`${e.name}에게 ${f.n} 피해`); dealToEnemy(e,f.n,owner); }); render(); await T(380); break; }
    case 'aura': C.auras.push({k:f.k,n:f.n,owner,name:d.name}); L(`파워 <b>${d.name}</b>: ${auraText(f.k,f.n).replace(/<[^>]+>/g,'')}`,'lc'); break;
    case 'block': allyTargets().forEach(s=>{C.u[s].block+=f.n; addFx(s,'blk',f.n);}); break;
    case 'stance': if(owner){ C.u[owner].stance={kind:f.k,base:f.base,coins:f.coins,cp:f.cp,name:d.name}; L(`${sname(owner)}: ${f.k==='evade'?'회피':'수비'} 자세`); } break;
    case 'heal': allyTargets().forEach(s=>healSinner(s,f.n)); break;
    case 'draw': drawCards(f.n); break;
    case 'energy': C.energy+=f.n; break;
    case 'sp': allyTargets().forEach(s=>spChange(s,f.n)); break;
    case 'power': allyTargets().forEach(s=>{C.u[s].st.power=(C.u[s].st.power||0)+f.n;}); break;
    case 'cleanse': allyTargets().forEach(s=>{delete C.u[s].st.bleed; delete C.u[s].st.burn;}); break;
    case 'guard': if(tgtA){ C.u[tgtA].guardBy=owner; L(`${sname(owner)}이(가) ${sname(tgtA)}을(를) 엄호한다.`); } break;
    case 'selfdmg': if(owner){ const p=S.party[owner]; p.hp=Math.max(1,p.hp-f.n); addFx(owner,'hit',f.n); } break;
    case 'move': if(owner){ const i=S.formation.indexOf(owner); const to=f.to?f.to-1:Math.max(0,i+(f.d||0)); moveTo(owner,to); render(); await T(220); } break;
    case 'status':{
      const list=d.target==='allEnemies'?C.enemies.slice():(tgtE&&C.enemies.includes(tgtE)?[tgtE]:[]);
      list.forEach(e=>{e.st[f.s]=(e.st[f.s]||0)+f.n;});
      break;}
  }
}
function moveTo(sid,idx){
  const f=S.formation, i=f.indexOf(sid); if(i<0) return;
  idx=clamp(idx,0,f.length-1); if(i===idx) return;
  f.splice(i,1); f.splice(idx,0,sid);
}
const sinColor=sid=>`var(--sin-${SINNERS[sid].sin})`;
async function sinnerAttack(sid,f,d,tgtE,X=0){
  const times=f.timesX?X:(f.times||1);
  const f2={...f,coins:f.coins+(f.coinsX?X:0)};
  const cc=C;
  if(!times) L(`${d.name}: X가 0이라 아무 일도 없었다.`);
  for(let i=0;i<times;i++){
    if(C!==cc||C.over||!S.formation.includes(sid)) return;
    if(d.target==='enemy'&&(!tgtE||!C.enemies.includes(tgtE))) return;
    await sinnerAttackOnce(sid,f2,d,tgtE);
  }
}
async function sinnerAttackOnce(sid,f,d,tgtE){
  const u=C.u[sid], cc=C;
  if(bleedTick(u.st,b=>{ L(`${sname(sid)} 출혈로 ${b} 피해`,'lb'); dealToSinner(sid,b,true); })){ render(); await T(300); if(C!==cc||!S.formation.includes(sid)) return; }
  const targets=d.target==='allEnemies'?validEnemies(d):(tgtE&&C.enemies.includes(tgtE)?[tgtE]:[]);
  if(!targets.length) return;
  const firstAtk=!C.firstAtk; C.firstAtk=true;
  C.actors={a:sid,t:targets.map(e=>e.uid)}; render();
  if(targets.length===1&&canClash(targets[0],sid)){
    const e=targets[0]; const won=await doClash(sid,f,e,d);
    if(won&&C===cc&&C.enemies.includes(e)) afterHit(sid,e,firstAtk);
    return;
  }
  const r=roll(f.base,f.coins,f.cp,chance(sid));
  const b0=atkBonus(sid,f,targets[0]);
  await Stage.single({head:`${sname(sid)} · ${d.name} → ${targets.length>1?'적 '+targets.length+'명':targets[0].name}`,
    name:sname(sid),skill:d.name,base:f.base+b0,coins:f.coins,cp:f.cp,chance:chance(sid),roll:{...r,total:r.total+b0},ally:true,sin:sinColor(sid)});
  if(C!==cc) return;
  const dmgs=[];
  for(const e of targets){
    if(!C.enemies.includes(e)) continue;
    const raw=r.total+atkBonus(sid,f,e);
    const dmg=outMod(raw,u.st,e.st,e.staggered);
    L(`${coinHTML(r)} 위력 ${raw} → ${e.name}에게 <b>${dmg}</b> 피해`);
    dmgs.push(dmg);
    dealToEnemy(e,dmg,sid);
    if(C.enemies.includes(e)) afterHit(sid,e,firstAtk);
  }
  Stage.verdict(`<b class="num">${dmgs.join(' · ')}</b> 피해`,'hitv');
  render(); await T(420);
}
function afterHit(sid,e,firstAtk){
  if(sid==='yisang') e.st.weak=(e.st.weak||0)+1;
  if(firstAtk&&has('thread')){ e.st.bleed=(e.st.bleed||0)+3; L(`붉은 실타래: ${e.name} 출혈 3`); }
}
function clashRanges(sid,f,e){
  const pb=f.base+atkBonus(sid,f,e), eb=e.intent.base+(e.power||0);
  return {p:[pb,pb+f.coins*f.cp], e:[eb,eb+e.intent.coins*e.intent.cp]};
}
async function doClash(sid,f,e,d){
  const it=e.intent, u=C.u[sid], cc=C;
  if(bleedTick(e.st,b=>{ L(`${e.name} 출혈로 ${b} 피해`,'lb'); dealToEnemy(e,b,null); })){ render(); await T(300); if(C!==cc||!C.enemies.includes(e)) return false; }
  const pb=f.base+atkBonus(sid,f,e), eb=it.base+(e.power||0);
  let pc=f.coins, ec=it.coins, rounds=0;
  L(`합! ${sname(sid)} vs ${e.name}`,'lc');
  await Stage.duelOpen(
    {name:sname(sid),skill:d.name,base:pb,coins:pc,cp:f.cp,chance:chance(sid),ally:true,sin:sinColor(sid)},
    {name:e.name,skill:it.name,base:eb,coins:ec,cp:it.cp,chance:50,sin:`var(--sin-${ENEMIES[e.id].sin})`});
  while(pc>0&&ec>0&&rounds<12){
    if(C!==cc) return false;
    const pr=roll(pb,pc,f.cp,chance(sid)), er=roll(eb,ec,it.cp,50); rounds++;
    let res=0, word='무승부';
    if(pr.total>er.total){ec--;res=1;word='우세';} else if(er.total>pr.total){pc--;res=-1;word='열세';}
    L(`&nbsp;${coinHTML(pr)} <b>${pr.total}</b> : <b>${er.total}</b> ${coinHTML(er)} · ${word}`);
    await Stage.duelRound(rounds,pr,er,res);
  }
  if(C!==cc) return false;
  it.used=true;
  const won=pc>0&&(ec===0||pc>ec);
  if(won){
    it.cancelled=true;
    const r=roll(pb,pc,f.cp,chance(sid));
    await Stage.duelFinal('L',r,'합 승리!','winv');
    if(C!==cc) return false;
    const dmg=outMod(r.total,u.st,e.st,e.staggered);
    L(`<b>합 승리</b>: 적의 행동 취소. 남은 코인 ${coinHTML(r)}로 <b>${dmg}</b> 피해`,'lg');
    spChange(sid,spRule(sid).clashWin);
    if(has('glasses')) drawCards(1);
    if(has('gear')) C.u[sid].st.power=(C.u[sid].st.power||0)+1;
    if(sid==='donqui'&&!C.clashBonus){ C.clashBonus=true; C.energy+=1; L('정의의 돌격: 에너지 +1','lg'); }
    dealToEnemy(e,dmg,sid);
    Stage.verdict(`합 승리 · <b class="num">${dmg}</b> 피해 · SP +${spRule(sid).clashWin}`,'winv');
    render(); await T(520);
    return true;
  }else{
    const r=roll(eb,Math.max(ec,1),it.cp,50);
    await Stage.duelFinal('R',r,'합 패배…','losev');
    if(C!==cc) return false;
    L(`<b>합 패배</b>: ${e.name}의 공격을 ${sname(sid)}이(가) 대신 맞는다.`,'lb');
    if(spRule(sid).clashLose) spChange(sid,spRule(sid).clashLose);
    const taken=await enemyHit(e,it,[sid],r,false);
    Stage.verdict(`합 패배 · ${sname(sid)} <b class="num">${taken[0]||0}</b> 피해`,'losev');
    render(); await T(520);
    return false;
  }
}
async function enemyHit(e,it,targets,r,allowStance=true){
  const taken=[], cc=C;
  for(const sid of targets){
    if(C!==cc||!S.formation.includes(sid)){ taken.push(0); continue; }
    const u=C.u[sid];
    let raw=r.total;
    const stc=allowStance?u.stance:null;
    if(stc){
      const sr=roll(stc.base,stc.coins,stc.cp,chance(sid));
      const ok=stc.kind==='evade'?sr.total>=r.total:true;
      await Stage.defend(sid,stc,sr,e,it,r,ok);
      if(C!==cc){ taken.push(0); continue; }
      if(stc.kind==='evade'){
        if(ok){ L(`${coinHTML(sr)} ${sname(sid)} <b>회피 성공</b> (${sr.total} ≥ ${r.total})`,'lg'); addFx(sid,'evd',0); if(has('shardg')&&C.enemies.includes(e)){ L(`날 선 거울 조각: ${e.name}에게 4 피해`,'lc'); dealToEnemy(e,4,sid); } taken.push(0); render(); await T(200); continue; }
        L(`${coinHTML(sr)} ${sname(sid)} 회피 실패 (${sr.total} < ${r.total})`,'lb'); u.stance=null;
      }else{
        u.stance=null; const red=Math.min(raw,sr.total); raw-=red;
        L(`${coinHTML(sr)} ${sname(sid)} <b>수비</b>: 위력 ${red} 막음`,'lg');
      }
    }
    const dmg=outMod(raw,e.st,u.st,false);
    const hp0=S.party[sid].hp;
    if(dmg>0){ L(`${coinHTML(r)} ${e.name} → ${sname(sid)} <b>${dmg}</b> 피해`,'lb'); dealToSinner(sid,dmg);
      const cb=C.auras.filter(a=>a.k==='counterBleed'&&(!a.owner||S.formation.includes(a.owner))).reduce((t,a)=>t+a.n,0);
      if(cb&&C.enemies.includes(e)){ e.st.bleed=(e.st.bleed||0)+cb; L(`역습: ${e.name} 출혈 ${cb}`,'lc'); } }
    else L(`${sname(sid)}이(가) 공격을 완전히 막아냈다.`,'lg');
    if(it.st&&dmg>0&&S.formation.includes(sid)) u.st[it.st.s]=(u.st[it.st.s]||0)+it.st.n;
    taken.push(Math.max(0,hp0-Math.max(0,S.party[sid].hp)));
    render();
  }
  return taken;
}
async function executeIntent(e){

  }else if(it.type==='stress'){

    C.actors={a:e.uid,t:C.enemies.map(x=>x.uid)}; render();
    await Stage.notice(`${e.name} · ${it.name}`,`적 모두 위력 +${it.power}`);
    C.enemies.forEach(x=>x.power+=it.power); L(`${e.name}: ${it.name} — 적 모두 위력 +${it.power}`);
  }else if(it.type==='debuff'){
    const t=resolvedTarget(e);
    if(t){ C.actors={a:e.uid,t:[t]}; render();
      await Stage.notice(`${e.name} · ${it.name}`,`${sname(t)} ${STATUS[it.st.s].n} ${it.st.n}`);
      if(C!==cc||!C.u[t]) return;
      C.u[t].st[it.st.s]=(C.u[t].st[it.st.s]||0)+it.st.n; L(`${e.name}: ${it.name} — ${sname(t)} ${STATUS[it.st.s].n} ${it.st.n}`); }
  }else if(it.type==='push'){
    C.actors={a:e.uid,t:S.formation.slice()}; render();
    await Stage.notice(`${e.name} · ${it.name}`,`<span class="ls">진형이 뒤집힌다 · 거울 균열 ${it.cards}장</span>`);
    S.formation.reverse();

    L(`${e.name}: <b>${it.name}</b> — 진형이 뒤집히고 균열 ${it.cards}장이 버림 더미에 섞였다.`,'ls');
  }else if(it.type==='summon'){
    C.actors={a:e.uid,t:[]}; render();

  }

async function endTurn(){
  if(!C||C.busy||C.over) return;
  const cc=C;
  C.busy=true; C.enemyPhase=true; A.skip=false; UI.sel=null; UI.selUnit=null; UI.cons=null;
  // 저주: 피의 빚
  const debts=C.hand.filter(c=>c.id==='debt').length;
  for(let i=0;i<debts;i++){ if(S.formation.length){ const s=pick(S.formation); spChange(s,-5); L(`피의 빚: ${sname(s)} SP -5`,'ls'); } }
  const keep=[];
  for(const c of C.hand){ const cd=CARDS[c.id];
    if(cd.retain) keep.push(c);
    else if(cd.ethereal){ C.exh.push(c); L(`${cd.name}: 휘발되어 사라졌다.`); }
    else C.disc.push(c); }
  C.hand=keep;
  render();
  try{
    for(const e of C.enemies) e.block=0;
    for(const e of C.enemies.slice()){
      if(C!==cc||C.over) break;
      if(!C.enemies.includes(e)) continue;
      await sleep(FAST?0:(A.speed===0||A.skip)?140:Math.round(300/A.speed));
      if(C!==cc||C.over) break;
      await executeIntent(e);
      if(C!==cc) break;
      C.actors=null; render();
    }
    Stage.close();
    if(C===cc&&!C.over) roundEnd();
    if(C===cc&&!C.over){ C.round++; S.stats.turns++; startPlayerTurn(false); }
  }catch(err){ console.error(err); toast('오류: '+(err.message||err)); }
  finally{
    Stage.close();
    if(C===cc){ C.busy=false; C.enemyPhase=false; C.actors=null; render(); maybeFinish(); }
  }
}
function roundEnd(){
  for(const e of C.enemies) e.staggered=false;
  // 화상
  for(const sid of S.formation.slice()){ const u=C.u[sid]; if((u.st.burn||0)>0){ const b=u.st.burn; u.st.burn--; L(`${sname(sid)} 화상 ${b}`,'lb'); dealToSinner(sid,b,true); if(C.over) return; } }
  for(const e of C.enemies.slice()){ if((e.st.burn||0)>0){ const b=e.st.burn; e.st.burn--; L(`${e.name} 화상 ${b}`,'lb'); dealToEnemy(e,b,null); if(C.over) return; } }
  // 지속 시간
  const tick=st=>{ for(const k of ['vuln','weak']) if(st[k]>0){ st[k]--; if(!st[k]) delete st[k]; } for(const k of ['bleed','burn']) if(st[k]<=0) delete st[k]; };
  C.enemies.forEach(e=>tick(e.st));
  for(const sid of S.formation){
    const u=C.u[sid]; tick(u.st); u.guardBy=null;
    if(u.panic){ u.panic=false; S.party[sid].sp=-15; L(`${sname(sid)}이(가) 패닉에서 벗어났다. (SP -15)`,'ls'); }
  }
}
function moveAction(sid,dir){
  if(!C||C.busy||C.over) return;
  if(C.energy<1){ toast('에너지가 부족하다'); return; }
  const i=S.formation.indexOf(sid), j=i+dir;
  if(i<0||j<0||j>=S.formation.length) return;
  C.energy-=1; moveTo(sid,j);
  L(`${sname(sid)} 자리 이동 → ${j+1}열`);
  render();
}

function finishCombat(){
  if(!C||C.finished) return; C.finished=true; Stage.close();
  if(C.over==='lose'){ endRun(false); return; }
  // 전투 한정 상태 정리
  for(const p of Object.values(S.party)) if(!p.down&&!p.gone&&p.hp<1) p.hp=1;
  if(C.kind==='boss'&&S.floor>=FLOORS){ C=null; endRun(true); return; }
  const boss=C.kind==='boss', elite=C.kind==='elite';
  const enk=(boss?ri(55,65):elite?ri(40,50):ri(18,26))+(has('ledger')?15:0)+(pack().perk.enk||0);
  S.enk+=enk;
  const down=Object.values(S.party).filter(p=>p.down&&!p.gone).map(p=>p.id);
  S.reward={enk,boss,cards:rewardCards(boss||elite?'elite':'normal'),cardDone:false,gift:boss||elite?randomGift():null,giftDone:false,down};
  C=null; S.screen='reward'; save(); render();
}
function rewardCards(kind){
  const w=kind==='elite'?{'일반':40,'고급':40,'희귀':20}:kind==='shop'?{'일반':50,'고급':35,'희귀':15}:{'일반':60,'고급':32,'희귀':8};
  if(S.pack&&pack().perk.rare) w['희귀']*=pack().perk.rare;
  const total=Object.values(w).reduce((a,b)=>a+b,0);
  const want=kind!=='shop'&&has('seal')?4:3;
  const pool=Object.entries(CARDS).filter(([id,c])=>c.owner&&!c.starter&&S.formation.includes(c.owner));
  const out=[]; let guard=0;
  while(out.length<want&&guard++<80){
    let t=rnd()*total, rar='일반'; for(const [k,v] of Object.entries(w)){ if((t-=v)<0){rar=k;break;} }
    const cand=pool.filter(([id,c])=>c.rar===rar&&!out.includes(id));
    const any=pool.filter(([id])=>!out.includes(id));
    const src=cand.length?cand:any; if(!src.length) break;
    out.push(pick(src)[0]);
  }
  if(out.length&&!out.some(id=>CARDS[id].type==='공격')){
    const atk=pool.filter(([id,c])=>c.type==='공격'&&!out.includes(id));
    if(atk.length) out[out.length-1]=pick(atk)[0];
  }
  return out;
}
function randomGift(){
  const fromPack=(S.pack?pack().gifts:[]).filter(g=>!has(g)); if(fromPack.length) return pick(fromPack);
  const left=Object.keys(GIFTS).filter(g=>!has(g)); return left.length?pick(left):null;
}

const hurt=(sid,n)=>{ const p=S.party[sid]; p.hp=Math.max(1,p.hp-n); };
function upgradeOf(sid,n){
  let k=0;
  for(let i=0;i<n;i++){
    const mine=S.deck.filter(c=>CARDS[c.id].owner===sid&&canUpgrade(c)); const any=S.deck.filter(canUpgrade);
    const c=mine.length?pick(mine):(any.length?pick(any):null); if(!c) break; c.up=true; k++;
  }
  return k;
}

}

  return {cards:[...rewardCards('shop'),pick(NEUTRAL)].map(id=>({id,sold:false})),
          gifts:[...shuffle((S.pack?pack().gifts:[]).filter(g=>!has(g))),...shuffle(Object.keys(GIFTS).filter(g=>!has(g)&&!(S.pack&&pack().gifts.includes(g))))].slice(0,2).map(id=>({id,sold:false,price:ri(90,110)})),

function doSupply(){
  const got=[]; const c=pick(Object.keys(CONS));
  if(S.cons.length<3){ S.cons.push(c); got.push(CONS[c].n); }
  S.enk+=20; allSp(5);
  return `버려진 보급 상자를 찾았다. ${got.length?got.join(', ')+', ':''}엔케팔린 20을 챙겼다. 잠깐 숨을 돌려 모두 SP +5.${got.length?'':' (소모품 칸이 가득 차서 앰플은 두고 왔다.)'}`;
}
function useCons(i,targetSid){
  const id=S.cons[i]; if(!id) return false; const K=CONS[id];
  if(K.combatOnly&&!C){ toast('전투 중에만 쓸 수 있다'); return false; }
  if(K.target==='ally'){
    if(!S.formation.includes(targetSid)) return false;
    if(id==='heal') healSinner(targetSid,15);
    if(id==='calm') spChange(targetSid,25);
    if(C) L(`${K.n}: ${sname(targetSid)}`,'lg');
  }else if(id==='bomb'){
    if(!C||C.busy||C.over) return false;
    L(`${K.n}: 적 모두에게 8 피해`,'lc');
    C.enemies.slice().forEach(e=>dealToEnemy(e,8,null));
  }
  S.cons.splice(i,1); UI.cons=null;
  if(!C) save(); else maybeFinish();
  return true;
}

const ARROW_C={atk:'#e5483f',stress:'#c25bd0',debuff:'#9b82d6',clash:'#ecbd4e'};
function drawArrows(sd){
  const field=document.getElementById('field'), svg=document.getElementById('arrows');
  if(!field||!svg||!C) return;
  const fr=field.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${fr.width} ${fr.height}`);
  const rel=el=>{ if(!el) return null; const r=el.getBoundingClientRect(); return {x:r.left-fr.left,y:r.top-fr.top,w:r.width,h:r.height}; };
  const plate=id=>rel(field.querySelector(`.unit[data-id="${id}"]`));
  const ibox=id=>rel(field.querySelector(`.intent[data-for="${id}"]`));
  const atkSel=sd&&sd.target==='enemy'&&sd.fx.some(f=>f.t==='atk')&&!C.busy;
  let out='';
  const curve=(a,b,k,color,opt={})=>{
    const stacked=b.y>a.y+a.h-2;   // 모바일: 적이 위, 수감자가 아래
    let x1,y1,x2,y2,cx,cy;
    if(stacked){ x1=a.x+a.w/2; y1=a.y+a.h; x2=b.x+b.w/2; y2=b.y; cx=(x1+x2)/2+(k-1.5)*22; cy=(y1+y2)/2; }
    else{ x1=a.x+a.w/2; y1=a.y; x2=b.x+b.w/2; y2=b.y; cx=(x1+x2)/2; cy=Math.min(y1,y2)-(118+k*26); }
    const d=`M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${(y2-2).toFixed(1)}`;
    const mid={x:.25*x1+.5*cx+.25*x2, y:.25*y1+.5*cy+.25*y2};
    const mk=opt.marker||'r';
    let g=`<path d="${d}" fill="none" stroke="${color}" stroke-opacity=".22" stroke-width="${opt.thin?6:9}" stroke-linecap="round"/>`;
    g+=`<path class="arrow-line" d="${d}" fill="none" stroke="${color}" stroke-width="${opt.thin?2:3}" stroke-linecap="round" ${opt.dash?'stroke-dasharray="7 6"':''} marker-end="url(#ah-${mk})"/>`;
    if(opt.label){ const w=opt.label.length*7+14; g+=`<g transform="translate(${mid.x.toFixed(1)} ${mid.y.toFixed(1)})"><rect x="${-w/2}" y="-10" width="${w}" height="20" rx="3" fill="#120d0e" stroke="${color}"/><text y="4.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="${color}">${opt.label}</text></g>`; }
    return g;
  };
  C.enemies.forEach((e,k)=>{
    const it=e.intent;
    if(!it||it.cancelled||it.used||e.staggered||!['atk','stress','debuff'].includes(it.type)) return;
    const tg=it.tgt==='all'?S.formation.slice():[resolvedTarget(e)].filter(Boolean);
    const clash=atkSel&&validEnemies(sd).includes(e)&&canClash(e,sd.owner);
    const color=clash?ARROW_C.clash:ARROW_C[it.type];
    const pw=e.power||0;
    const lab=it.type==='atk'?`${it.base+pw}~${it.base+pw+it.coins*it.cp}`:it.type==='stress'?`SP -${it.sp}`:STATUS[it.st.s].n;
    const src0=plate(e.uid), ib=ibox(e.uid);
    tg.forEach((sid,j)=>{
      const dst=plate(sid); if(!dst||!src0) return;
      const stacked=dst.y>src0.y+src0.h-2;
      const src=stacked?src0:(ib||src0);
      out+=curve(src,dst,k,color,{thin:it.tgt==='all',dash:it.type==='debuff',label:j===0?(clash?'합 '+lab:lab):'',marker:clash?'g':it.type==='atk'?'r':'p'});
    });
  });
  const mk=(id,c)=>`<marker id="ah-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
  svg.innerHTML=`<defs>${mk('r',ARROW_C.atk)}${mk('p',ARROW_C.stress)}${mk('g',ARROW_C.clash)}</defs>${out}`;
}

async function resolveCheck(sid){
  const ev=S.event; if(!ev||ev.result||ev.picking==null||UI.evBusy) return;
  const o=EVENTS[ev.id].opts[ev.picking]; if(!o||!o.check||!S.formation.includes(sid)) return;
  UI.evBusy=true; A.skip=false;
  const pct=checkPct(sid,o.check), ok=rnd()*100<pct;
  try{ await Stage.check(sid,o.check.sin,pct,ok); } finally { Stage.close(); }
  const txt=ok?o.win(sid):o.lose(sid);
  ev.result=`<b class="${ok?'okc':'failc'}">판정 ${ok?'성공':'실패'}</b> · ${sname(sid)} · ${SINS[o.check.sin]} ${pct}%<br>${txt}`;
  ev.picking=null; UI.evBusy=false; save(); render();
}

function handle(a,el){
  const id=el.dataset.id, i=el.dataset.i!=null?+el.dataset.i:null;
  switch(a){
    case 'noop': return;
    case 'speed': A.speed=A.speed===1?2:A.speed===2?0:1; try{localStorage.setItem('md-speed',String(A.speed))}catch(e){} toast(`연출 속도: ${SPEED_NAME[A.speed]}`); render(); return;
    case 'close': closeModal(); return;
    case 'help': openModal(helpHTML()); return;
    case 'deck': if(S) openModal(deckHTML()); return;
    case 'gifts': if(S) openModal(`<h2>E.G.O 기프트 · ${S.gifts.length}개</h2>${giftListHTML()}`); return;
    case 'title': closeModal(); C=null; if(S&&S.screen==='result') clearSave(); S=null; render(); return;
    case 'new': closeModal(); clearSave(); C=null; SEL=[]; S={screen:'select'}; renderSelect(); return;
    case 'continue':{ const sv=loadSave(); if(sv){ S=sv; C=null; render(); } return; }
    case 'abandon':
      openModal(`<h2>원정을 포기할까?</h2><p class="muted">저장된 진행이 지워진다.</p><div class="row"><button type="button" class="btn danger" data-a="abandonyes">포기한다</button></div>`); return;
    case 'abandonyes': closeModal(); endRun(false); return;
    case 'pick':{ const k=SEL.indexOf(id); if(k>=0) SEL.splice(k,1); else if(SEL.length<4) SEL.push(id); else toast('4명까지 고를 수 있다'); renderSelect(); return; }
    case 'fm':{ const d=+el.dataset.d, j=i+d; if(j<0||j>=SEL.length) return; [SEL[i],SEL[j]]=[SEL[j],SEL[i]]; renderSelect(); return; }
    case 'start': if(SEL.length===4){ newRun(SEL); render(); } return;
    case 'tomap': if(S){ C=null; S.screen='map'; render(); } return;
    case 'node': enterNode(id); return;
    case 'cons':{
      if(C&&(C.busy||C.over)) return;
      if(UI.cons===i){ UI.cons=null; render(); return; }
      const K=CONS[S.cons[i]]; if(!K) return;
      if(K.combatOnly&&!C){ toast('전투 중에만 쓸 수 있다'); return; }
      UI.cons=i; UI.sel=null; UI.selUnit=null; render(); return; }
    case 'mapally':
      if(UI.cons!=null&&CONS[S.cons[UI.cons]]?.target==='ally'){ if(useCons(UI.cons,id)) render(); }
      return;
    case 'card':{
      if(!C||C.busy||C.over) return;
      if(UI.cons!=null){ UI.cons=null; }
      const inst=C.hand.find(c=>c.u===id); if(!inst) return;
      const chk=canPlay(inst);
      if(!chk.ok){ toast(chk.why); UI.sel=null; render(); return; }
      const d=cdef(inst);
      if(UI.sel===id){
        if(['self','allAllies','allEnemies','none'].includes(d.target)) playCard(id,null);
        else UI.sel=null;
      } else { UI.sel=id; UI.selUnit=null; }
      render(); return; }
    case 'enemy':{
      if(!C||C.busy||C.over) return;
      if(UI.cons!=null&&CONS[S.cons[UI.cons]]?.target==='allEnemies'){ useCons(UI.cons,null); render(); return; }
      if(!UI.sel) return;
      const inst=C.hand.find(c=>c.u===UI.sel); if(!inst) return;
      const d=cdef(inst);
      if(d.target==='enemy') playCard(UI.sel,id);
      else if(d.target==='allEnemies') playCard(UI.sel,null);
      render(); return; }
    case 'ally':{
      if(!C||C.busy||C.over) return;
      if(UI.cons!=null){ if(CONS[S.cons[UI.cons]]?.target==='ally'&&useCons(UI.cons,id)) render(); return; }
      if(UI.sel){
        const inst=C.hand.find(c=>c.u===UI.sel); const d=inst&&cdef(inst);
        if(d&&d.target==='ally'){ if(validAllies(d).includes(id)) playCard(UI.sel,id); else toast('그 수감자는 대상이 될 수 없다'); render(); return; }
        if(d&&['self','allAllies'].includes(d.target)){ playCard(UI.sel,null); render(); return; }
        UI.sel=null;
      }
      UI.selUnit=UI.selUnit===id?null:id; render(); return; }
    case 'move': moveAction(id,+el.dataset.d); return;
    case 'end': endTurn(); return;
    case 'rwcard': if(!S.reward.cardDone){ S.deck.push(mkCard(id)); S.reward.cardDone=true; save(); toast(`${CARDS[id].name}을(를) 덱에 넣었다`); render(); } return;
    case 'rwskip': S.reward.cardDone='skip'; save(); render(); return;
    case 'rwgift': if(S.reward.gift&&!S.reward.giftDone){ S.gifts.push(S.reward.gift); S.reward.giftDone=true; save(); render(); } return;
    case 'revive':{
      const p=S.party[id]; if(!p||!p.down||S.clocks<1) return;
      S.clocks--; p.down=false; p.hp=Math.ceil(p.max*.3); addStartSp(id,-20); S.formation.push(id);
      S.reward.down=S.reward.down.filter(x=>x!==id); save(); toast(`째깍. ${sname(id)}이(가) 되살아났다`); render(); return; }
    case 'letgo':{
      const p=S.party[id]; if(!p) return;
      p.down=false; p.gone=true; S.deck=S.deck.filter(c=>CARDS[c.id].owner!==id);
      S.reward.down=S.reward.down.filter(x=>x!==id); save(); render(); return; }
    case 'rwdone': if(!S.reward.down.length) completeNode(); return;
    case 'evopt':{
      if(S.event.result||UI.evBusy) return;
      const o=EVENTS[S.event.id].opts[i]; if(!o||(o.can&&!o.can())) return;
      if(o.check){ S.event.picking=i; render(); return; }
      S.event.result=o.run(); save(); render(); return; }
    case 'evback': if(!UI.evBusy){ S.event.picking=null; render(); } return;
    case 'evsinner': return resolveCheck(id);
    case 'pack': choosePack(id); return;
    case 'prepopen': if(S.screen==='map'){ S.prep={node:null}; S.screen='prep'; save(); render(); } return;
    case 'pstart': startPrepared(); return;
    case 'pback': if(S.prep&&!S.prep.node&&activeDeck().length<minDeck()){ toast(`가져갈 카드가 ${minDeck()}장 이상이어야 한다`); return; } S.prep=null; S.screen='map'; save(); render(); return;
    case 'pfm':{ const d=+el.dataset.d, j=i+d; if(j<0||j>=S.formation.length) return; [S.formation[i],S.formation[j]]=[S.formation[j],S.formation[i]]; save(); render(); return; }
    case 'pcard':{
      const c=S.deck.find(x=>x.u===id); if(!c) return;
      if(!c.off&&CARDS[c.id].type==='저주'){ toast('저주는 뺄 수 없다'); return; }
      if(!c.off&&activeDeck().length<=minDeck()){ toast(`가져갈 카드는 최소 ${minDeck()}장`); return; }
      c.off=!c.off; save(); render(); return; }
    case 'done': completeNode(); return;
    case 'rest':{
      const k=el.dataset.k;
      if(k==='heal'){ S.formation.forEach(s=>healSinner(s,Math.ceil(S.party[s].max*.3))); S.rest.done='모두 상처를 싸매고 눈을 붙였다. 최대 체력의 30%를 회복했다.'; }
      else if(k==='talk'){ allSp(20); S.rest.done='시시한 농담이 오가고, 누군가 웃었다. 모두 SP +20.'; }
      else if(k==='up'){ S.rest.picking=true; }
      save(); render(); return; }
    case 'restback': S.rest.picking=false; render(); return;
    case 'restup':{ const c=S.deck.find(x=>x.u===id); if(c&&canUpgrade(c)){ c.up=true; S.rest.picking=false; S.rest.done=`${CARDS[c.id].name}을(를) 강화했다.`; save(); render(); } return; }
    case 'buycard':{
      const it=S.shop.cards[+id]; if(!it||it.sold) return; const pr=PRICE[CARDS[it.id].rar];
      if(S.enk<pr){ toast('엔케팔린이 부족하다'); return; }
      S.enk-=pr; it.sold=true; S.deck.push(mkCard(it.id)); save(); render(); return; }
    case 'buygift':{ const g=S.shop.gifts[i]; if(!g||g.sold||S.enk<g.price) return; S.enk-=g.price; g.sold=true; S.gifts.push(g.id); save(); render(); return; }
    case 'buycons':{ const cn=S.shop.cons; if(cn.sold||S.enk<30||S.cons.length>=3) return; S.enk-=30; cn.sold=true; S.cons.push(cn.id); save(); render(); return; }
    case 'remove': if(!S.shop.removed&&S.enk>=50&&S.deck.length>5){ S.shop.removing=true; render(); } return;
    case 'removeback': S.shop.removing=false; render(); return;
    case 'removecard':{ if(S.shop.removed) return; const c=S.deck.find(x=>x.u===id); if(!c) return; S.enk-=50; S.deck=S.deck.filter(x=>x!==c); S.shop.removed=true; S.shop.removing=false; save(); toast(`${CARDS[c.id].name}을(를) 덱에서 뺐다`); render(); return; }
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.closest('#modal')&&el.dataset.a==='noop') return;
  if(el.disabled||el.getAttribute('aria-disabled')==='true'&&el.dataset.a!=='card'){ return; }
  try{ handle(el.dataset.a,el); }catch(err){ console.error(err); toast('오류가 났다: '+(err.message||err)); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!document.getElementById('modal').hidden){ closeModal(); return; } UI.sel=null; UI.selUnit=null; UI.cons=null; if(S) render(); return; }
  if((e.key==='e'||e.key==='E')&&S&&S.screen==='combat'&&document.getElementById('modal').hidden&&!e.target.closest('input,textarea')){ endTurn(); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-a]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
});
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

// 테스트용 핸들
Stage.el=document.getElementById('stage');
Stage.el.addEventListener('click',()=>{A.skip=true;Stage.close();});
window.__md={get S(){return S},get C(){return C},handle:(a,ds={})=>handle(a,{dataset:ds}),canPlay,cdef,validEnemies,validAllies,reachable,playCard,endTurn,setDelay:v=>{FAST=v===0}};

render();
})();
</script>
